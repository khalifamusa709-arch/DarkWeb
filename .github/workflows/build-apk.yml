name: Build Android APK

on:
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up Environment & Build APK
      run: |
        # Tabbatar da an shigar da Java 17 da Node
        sudo apt-get update
        sudo apt-get install -y openjdk-17-jdk
        export JAVA_HOME=/usr/lib/jvm/java-17-openjdk-amd64
        
        # Shigar da abubuwan da shafin ke bukata da kuma gina web assets
        npm install
        npm run build || true

        # Shigar da Capacitor da gina Android APK
        npm install @capacitor/core @capacitor/cli @capacitor/android
        npx cap init DARKWEB com.darkweb.marketplace --web-dir dist || true
        npx cap add android || true

        # Gina Debug APK ta hanyar Gradle
        cd android
        chmod +x gradlew
        ./gradlew assembleDebug

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: darkweb-debug-apk
        path: android/app/build/outputs/apk/debug/app-debug.apk
