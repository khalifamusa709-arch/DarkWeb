name: Build Android APK

on:
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v3

    - name: Set up JDK 17
      uses: actions/setup-java@v3
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Set up Node.js
      uses: actions/setup-node@v3
      with:
        node-version: 18

    - name: Install Dependencies & Build Web Assets
      run: |
        npm install || true
        npm run build || true

    - name: Build Android Debug APK
      run: |
        npm install @capacitor/core @capacitor/cli @capacitor/android || true
        npx cap init DARKWEB com.darkweb.marketplace --web-dir dist || true
        npx cap add android || true
        cd android || true
        chmod +x gradlew || true
        ./gradlew assembleDebug || true

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v3
      with:
        name: darkweb-debug-apk
        path: android/app/build/outputs/apk/debug/app-debug.apk
